<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <mask id="reel-mask">
      <rect width="1080" height="1080" fill="black"/>
      <circle cx="622" cy="540" r="104" fill="white"/>
      <circle cx="706" cy="456" r="78" fill="black"/>
    </mask>
  </defs>

  <!-- CY -->
  <text x="150" y="638"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="268"
        fill="#111111">CY</text>

  <!-- Film reel O -->
  <rect width="1080" height="1080" fill="#111111" mask="url(#reel-mask)"/>
  <!-- 4 holes -->
  <circle cx="596" cy="514" r="24" fill="#ffffff"/>
  <circle cx="648" cy="514" r="24" fill="#ffffff"/>
  <circle cx="596" cy="566" r="24" fill="#ffffff"/>
  <circle cx="648" cy="566" r="24" fill="#ffffff"/>

  <!-- L -->
  <text x="748" y="638"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="268"
        fill="#111111">L</text>
</svg>
